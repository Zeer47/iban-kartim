
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBAN Bilgileri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      margin: 0;
      padding: 24px;
      color: #183b35;
    }
    .kart {
      max-width: 400px;
      margin: 60px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { font-size: 25px; }
    .etiket { color: #68736f; margin-top: 25px; }
    .iban { overflow-wrap: anywhere; font-weight: bold; }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      background: #183b35;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    #durum { color: #68736f; }
  </style>
</head>
<body>
  <main class="kart">
    <h1>IBAN Bilgileri</h1>
    <p id="durum">Bilgiler yükleniyor...</p>
    <div id="bilgiler" hidden>
      <p class="etiket">Hesap sahibi</p>
      <p id="isim"></p>
      <p class="etiket">IBAN numarası</p>
      <p id="iban" class="iban"></p>
      <button id="kopyala">IBAN'ı Kopyala</button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://erhmhhneoodngfjvldkc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zXb9-iTC9qrMPhVqZdkBlw_Szk6Adob";

    async function baslat() {
      const durum = document.getElementById("durum");
      const token = new URLSearchParams(location.search).get("id");

      if (!token) {
        durum.textContent = "Kart bağlantısı geçersiz.";
        return;
      }

      try {
        const cevap = await fetch(
          SUPABASE_URL + "/functions/v1/get-iban-card",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            },
            body: JSON.stringify({ token })
          }
        );

        const veri = await cevap.json();

        if (!cevap.ok) {
          throw new Error(veri.error || "Bilgiler alınamadı.");
        }

        document.getElementById("isim").textContent = veri.owner_name;
        document.getElementById("iban").textContent = veri.iban;
        document.getElementById("bilgiler").hidden = false;
        durum.hidden = true;

        document.getElementById("kopyala").onclick = async () => {
          try {
            await navigator.clipboard.writeText(veri.iban);
            alert("IBAN kopyalandı!");
          } catch {
            alert("Kopyalanamadı. IBAN'ı elle seçip kopyalayın.");
          }
        };
      } catch (hata) {
        durum.textContent = "Bilgiler yüklenemedi. Bağlantı veya sunucu ayarlarını kontrol edin.";
        console.error(hata);
      }
    }

    baslat();
  </script>
</body>
</html>
